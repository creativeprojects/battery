name: tests

on: [push, pull_request]

jobs:
    tests:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                go: ["1.26", "1.27"]
                os: [ubuntu-latest, ubuntu-26.04-arm, windows-11-arm, windows-latest, macos-latest, macos-26-intel]

        steps:
            - uses: actions/checkout@v7
            - name: setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: ${{ matrix.go }}

            - name: resolve dependencies
              run: go get -v -t -d ./...
            - name: build
              run: go build -v .
            - name: test
              run: go test -v .
